services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/api
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: akiha
      MYSQL_USER: akiha
      MYSQL_PASSWORD: akiha
      TZ: Asia/Tokyo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP で接続できるまで api を待たせる（初期化中の一時サーバーでは通らない）
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uakiha", "-pakiha"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  db-data:
